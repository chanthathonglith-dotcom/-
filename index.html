<!doctype html>
<html lang="lo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ລະບົບຈັດການເອກະສານຂາເຂົ້າ-ຂາອອກ</title>
    <meta
      name="description"
      content="ລະບົບຄຸ້ມຄອງເອກະສານຂາເຂົ້າ-ຂາອອກ ແລະ ຈັດເກັບຟາຍສະແກນ ເຊື່ອມຕໍ່ Google Sheets ແລະ Google Drive ພ້ອມລະບົບເຂົ້າສູ່ລະບົບດ້ວຍ Google Account."
    />
    <meta property="og:title" content="ລະບົບຈັດການເອກະສານຂາເຂົ້າ-ຂາອອກ" />
    <meta
      property="og:description"
      content="ລະບົບຄຸ້ມຄອງເອກະສານຂາເຂົ້າ-ຂາອອກ ແລະ ຈັດເກັບຟາຍສະແກນ ເຊື່ອມຕໍ່ Google Sheets ແລະ Google Drive."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ເອກະສານ" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Lao:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('doc_archive_theme_v1');
          var dark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-100 selection:text-blue-900 dark:selection:bg-blue-900/50 dark:selection:text-blue-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
